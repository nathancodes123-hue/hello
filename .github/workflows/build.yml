name: Build NovaOS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build bootable image
        run: make
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: novaos-image
          path: build/novaos.img
